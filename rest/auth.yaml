openapi: 3.0.3
info:
  title: Auth Service API Contract
  description: Authentication, registration, password lifecycle, and session management. This contract describes the checked-in
    HTTP API with the default routing and security configuration. OTP endpoints expose the challenge flow. The current NotificationService
    has no delivery transport wired in.
  version: 0.0.1-SNAPSHOT
servers:
  - url: http://localhost:8080
    description: Default local development server.
tags:
  - name: Login
  - name: Registration
  - name: Session
  - name: Password
  - name: Configuration
paths:
  /api/v1/auth/login-password:
    post:
      tags: [Login]
      summary: Authenticate with identifier and password
      operationId: loginWithPassword
      description: The server can require an OTP based on account 2FA or service configuration. When all required factors
        are verified and credentials are expired, the server returns a grant for /api/v1/auth/password/expired/complete.
      security: []
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: Authenticate with identifier and password.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/Authenticated'
                          - $ref: '#/components/schemas/OtpRequired'
                          - $ref: '#/components/schemas/PasswordChangeRequired'
              examples:
                authenticated:
                  value:
                    success: true
                    message: Logged in successfully.
                    messageFa: ورود با موفقیت انجام شد.
                    data:
                      step: SUCCESS
                      tokens:
                        tokenType: Bearer
                        accessToken: eyJhbGciOiJSUzI1NiIsInR5cCI6ImF0K2p3dCJ9.eyJzdWIiOiIxIn0.c2lnbmF0dXJl
                        accessExpiresIn: 900
                        refreshToken: 8ex-3JNM4U_Z5eQtxrQEjw5v0Tc4B9c_ZtUn7ZgkZ68
                        refreshExpiresIn: 604800
                    timestamp: '2026-11-04T12:00:00Z'
                otpRequired:
                  value:
                    success: true
                    message: If the account is eligible, a verification code will be sent.
                    messageFa: در صورت امکان ورود به حساب، کد تأیید ارسال می‌شود.
                    data:
                      step: OTP_REQUIRED
                      challenge:
                        mfaToken: CUoGjDYn0yyAscrbaE9SaJEcUcjHcdwLj07ZoZu7yu8
                        channel: EMAIL
                        expiresIn: 300
                        resendAfter: 60
                    timestamp: '2026-11-04T12:00:00Z'
                passwordChangeRequired:
                  value:
                    success: true
                    message: Choose a new password to complete sign-in.
                    messageFa: برای تکمیل ورود، رمز عبور جدید انتخاب کنید.
                    data:
                      step: PASSWORD_CHANGE_REQUIRED
                      passwordChange:
                        passwordChangeToken: CUoGjDYn0yyAscrbaE9SaJEcUcjHcdwLj07ZoZu7yu8
                        expiresIn: 300
                    timestamp: '2026-11-04T12:00:00Z'
        '400':
          description: |-
            - `INVALID_REQUEST` — Invalid input or an unreadable request body.
            - `INVALID_IDENTIFIER` — Identifier is neither a supported email nor a supported phone number.
            - `INVALID_PASSWORD_LENGTH` — Password exceeds 72 UTF-8 bytes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      code: {type: string, enum: [INVALID_REQUEST, INVALID_IDENTIFIER, INVALID_PASSWORD_LENGTH]}
                      data:
                        $ref: '#/components/schemas/ValidationData'
              examples:
                unreadableBody:
                  $ref: '#/components/examples/unreadableBody'
                fieldValidation:
                  value:
                    success: false
                    code: INVALID_REQUEST
                    message: One or more fields are invalid.
                    messageFa: یک یا چند فیلد نامعتبر است.
                    data:
                      errors:
                        identifier: This field is required.
                    timestamp: '2026-11-04T12:00:00Z'
        '401':
          description: '- `INVALID_CREDENTIALS` — Invalid credentials, ineligible account, or invalid current session.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      code: {type: string, enum: [INVALID_CREDENTIALS]}
                      data:
                        $ref: '#/components/schemas/NullData'
        '429':
          description: |-
            - `RATE_LIMITED` — IP request limit exceeded.
            - `OTP_COOLDOWN` — Wait before requesting another code.
            - `LOGIN_TEMPORARILY_LOCKED` — Too many failed attempts temporarily locked the identifier or account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      code: {type: string, enum: [RATE_LIMITED, OTP_COOLDOWN, LOGIN_TEMPORARILY_LOCKED]}
                      data:
                        $ref: '#/components/schemas/RetryData'
              examples:
                rateLimited:
                  $ref: '#/components/examples/rateLimited'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: |-
            - `LOGIN_DISABLED` — Login is temporarily disabled.
            - `OTP_CHANNEL_DISABLED` — The requested verification channel is disabled.
            - `AUTH_SERVICE_UNAVAILABLE` — A required dependency is temporarily unavailable.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      code: {type: string, enum: [LOGIN_DISABLED, OTP_CHANNEL_DISABLED, AUTH_SERVICE_UNAVAILABLE]}
                      data:
                        $ref: '#/components/schemas/NullData'
              examples:
                serviceUnavailable:
                  $ref: '#/components/examples/serviceUnavailable'
