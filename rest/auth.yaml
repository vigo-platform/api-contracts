components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserAgent:
      name: User-Agent
      in: header
      required: false
      description: Client metadata, truncated by the server to 512 characters.
      schema: {type: string}
    DeviceId:
      name: X-Device-Id
      in: header
      required: false
      description: Optional client device identifier, truncated by the server to 128 characters.
      schema: {type: string}
  headers:
    Cache-Control:
      description: Auth response cache policy.
      required: true
      schema: {type: string, enum: [no-store]}
    Pragma:
      description: Compatibility cache header on auth workflow responses.
      required: true
      schema: {type: string, enum: [no-cache]}
    Retry-After:
      description: Wait time in seconds.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    WWW-Authenticate:
      description: Present when the security layer rejects a missing or invalid access JWT.
      required: false
      schema: {type: string, enum: [Bearer]}
  responses:
    UnsupportedMediaType:
      description: Unsupported request media type.
      headers:
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code: {type: string, enum: [UNSUPPORTED_MEDIA_TYPE]}
                  data:
                    $ref: '#/components/schemas/NullData'
          examples:
            unsupportedMediaType:
              value:
                success: false
                code: UNSUPPORTED_MEDIA_TYPE
                message: Use an application/json request body.
                messageFa: بدنه درخواست باید JSON باشد.
                data: null
                timestamp: '2026-11-04T12:00:00Z'
    InternalError:
      description: Unexpected server error.
      headers:
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code: {type: string, enum: [INTERNAL_ERROR]}
                  data:
                    $ref: '#/components/schemas/NullData'
          examples:
            internalError:
              value:
                success: false
                code: INTERNAL_ERROR
                message: An unexpected error occurred.
                messageFa: خطای غیرمنتظره رخ داد.
                data: null
                timestamp: '2026-11-04T12:00:00Z'
    ServiceUnavailable:
      description: A required service or data store is temporarily unavailable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code: {type: string, enum: [AUTH_SERVICE_UNAVAILABLE]}
                  data:
                    $ref: '#/components/schemas/NullData'
          examples:
            serviceUnavailable:
              value:
                success: false
                code: AUTH_SERVICE_UNAVAILABLE
                message: Authentication is temporarily unavailable.
                messageFa: سرویس احراز هویت موقتاً در دسترس نیست.
                data: null
                timestamp: '2026-11-04T12:00:00Z'
  examples:
    unreadableBody:
      value:
        success: false
        code: INVALID_REQUEST
        message: Send a valid JSON body with the expected field types.
        messageFa: بدنهٔ درخواست باید JSON معتبر با نوع دادهٔ درست باشد.
        data: null
        timestamp: '2026-11-04T12:00:00Z'
    missingAccessToken:
      value:
        success: false
        code: UNAUTHORIZED
        message: Authentication is required.
        messageFa: احراز هویت الزامی است.
        data: null
        timestamp: '2026-11-04T12:00:00Z'
    serviceUnavailable:
      value:
        success: false
        code: AUTH_SERVICE_UNAVAILABLE
        message: Authentication is temporarily unavailable.
        messageFa: سرویس احراز هویت موقتاً در دسترس نیست.
        data: null
        timestamp: '2026-11-04T12:00:00Z'
    rateLimited:
      value:
        success: false
        code: RATE_LIMITED
        message: Too many attempts. Please try again later.
        messageFa: تعداد درخواست‌ها بیش از حد مجاز است. کمی بعد دوباره تلاش کنید.
        data:
          retryAfterSeconds: 42
        timestamp: '2026-11-04T12:00:00Z'
  schemas:
    OpaqueToken:
      type: string
      pattern: ^[A-Za-z0-9_-]{43}$
      description: Opaque token issued by Auth. Preserve its value exactly.
      example: CUoGjDYn0yyAscrbaE9SaJEcUcjHcdwLj07ZoZu7yu8
    Identifier:
      type: string
      minLength: 1
      maxLength: 254
      description: Email or mobile number. Surrounding whitespace is stripped. Email is lowercased. Phone accepts an international
        number starting with + or Iranian mobile notation with no prefix, 0, or 0098.
      example: user@example.com
    ExistingPassword:
      type: string
      format: password
      minLength: 1
      maxLength: 72
      description: Must contain a non-whitespace character and occupy at most 72 UTF-8 bytes.
    NewPassword:
      type: string
      format: password
      maxLength: 72
      description: Must contain a non-whitespace character, have at least eight UTF-16 code units (Java String length), and
        occupy at most 72 UTF-8 bytes.
    PasswordLoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          $ref: '#/components/schemas/Identifier'
        password:
          $ref: '#/components/schemas/ExistingPassword'
    EmailLoginRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
          example: user@example.com
    PhoneLoginRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          pattern: ^(?:\+[1-9][0-9]{1,14}|(?:0098|0)?9[0-9]{9})$
          example: 09123456789
    VerifyOtpRequest:
      type: object
      description: 'Use mfaToken in new clients. Accepted input aliases: mfa, mfa_token. Send a single spelling.'
      required: [otp]
      properties:
        mfaToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          example: CUoGjDYn0yyAscrbaE9SaJEcUcjHcdwLj07ZoZu7yu8
        otp:
          type: string
          pattern: ^[0-9]{6}$
          example: '012345'
        mfa:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          example: CUoGjDYn0yyAscrbaE9SaJEcUcjHcdwLj07ZoZu7yu8
          description: Input alias for mfaToken.
        mfa_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          example: CUoGjDYn0yyAscrbaE9SaJEcUcjHcdwLj07ZoZu7yu8
          description: Input alias for mfaToken.
      anyOf:
        - required: [mfaToken]
        - required: [mfa]
        - required: [mfa_token]
    IdentifierRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          $ref: '#/components/schemas/Identifier'
    RegisterRequest:
      type: object
      description: 'Use registrationToken in new clients. Accepted input aliases: registration_token. Send a single spelling.'
      required: [password]
      properties:
        registrationToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          example: CUoGjDYn0yyAscrbaE9SaJEcUcjHcdwLj07ZoZu7yu8
        password:
          $ref: '#/components/schemas/NewPassword'
        firstName:
          type: string
          maxLength: 100
          nullable: true
        lastName:
          type: string
          maxLength: 100
          nullable: true
        registration_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          example: CUoGjDYn0yyAscrbaE9SaJEcUcjHcdwLj07ZoZu7yu8
          description: Input alias for registrationToken.
      anyOf:
        - required: [registrationToken]
        - required: [registration_token]
    RefreshRequest:
      type: object
      description: 'Use refreshToken in new clients. Accepted input aliases: refresh_token. Send a single spelling.'
      properties:
        refreshToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          example: CUoGjDYn0yyAscrbaE9SaJEcUcjHcdwLj07ZoZu7yu8
        refresh_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          example: CUoGjDYn0yyAscrbaE9SaJEcUcjHcdwLj07ZoZu7yu8
          description: Input alias for refreshToken.
      anyOf:
        - required: [refreshToken]
        - required: [refresh_token]
    PasswordChangeInitiateRequest:
      type: object
      required: [currentPassword]
      properties:
        currentPassword:
          $ref: '#/components/schemas/ExistingPassword'
    PasswordChangeCompleteRequest:
      type: object
      description: 'Use passwordChangeToken in new clients. Accepted input aliases: password_change_token. Send a single spelling.'
      required: [newPassword]
      properties:
        passwordChangeToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          example: CUoGjDYn0yyAscrbaE9SaJEcUcjHcdwLj07ZoZu7yu8
        newPassword:
          $ref: '#/components/schemas/NewPassword'
        password_change_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          example: CUoGjDYn0yyAscrbaE9SaJEcUcjHcdwLj07ZoZu7yu8
          description: Input alias for passwordChangeToken.
      anyOf:
        - required: [passwordChangeToken]
        - required: [password_change_token]
    PasswordResetCompleteRequest:
      type: object
      description: 'Use passwordResetToken in new clients. Accepted input aliases: password_reset_token. Send a single spelling.'
      required: [newPassword]
      properties:
        passwordResetToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          example: CUoGjDYn0yyAscrbaE9SaJEcUcjHcdwLj07ZoZu7yu8
        newPassword:
          $ref: '#/components/schemas/NewPassword'
        password_reset_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          example: CUoGjDYn0yyAscrbaE9SaJEcUcjHcdwLj07ZoZu7yu8
          description: Input alias for passwordResetToken.
      anyOf:
        - required: [passwordResetToken]
        - required: [password_reset_token]
    OtpChannel: {type: string, enum: [EMAIL, SMS, IN_APP]}
    ContactOtpChannel: {type: string, enum: [EMAIL, SMS]}
    TokenPair:
      type: object
      additionalProperties: false
      required: [tokenType, accessToken, accessExpiresIn, refreshToken, refreshExpiresIn]
      properties:
        tokenType: {type: string, enum: [Bearer]}
        accessToken:
          type: string
          description: RS256 access JWT.
        accessExpiresIn:
          type: integer
          format: int64
          description: Access token lifetime in seconds.
        refreshToken:
          $ref: '#/components/schemas/OpaqueToken'
        refreshExpiresIn:
          type: integer
          format: int64
          description: Refresh token lifetime in seconds, capped by session expiry.
    OtpChallenge:
      type: object
      additionalProperties: false
      required: [mfaToken, channel, expiresIn, resendAfter]
      properties:
        mfaToken:
          $ref: '#/components/schemas/OpaqueToken'
        channel:
          $ref: '#/components/schemas/OtpChannel'
        expiresIn:
          type: integer
          format: int64
          description: Challenge lifetime in seconds.
        resendAfter:
          type: integer
          format: int64
          description: Wait in seconds before requesting another code.
    EmailOtpChallenge:
      type: object
      additionalProperties: false
      required: [mfaToken, channel, expiresIn, resendAfter]
      properties:
        mfaToken:
          $ref: '#/components/schemas/OpaqueToken'
        channel: {type: string, enum: [EMAIL]}
        expiresIn:
          type: integer
          format: int64
          description: Challenge lifetime in seconds.
        resendAfter:
          type: integer
          format: int64
          description: Wait in seconds before requesting another code.
    SmsOtpChallenge:
      type: object
      additionalProperties: false
      required: [mfaToken, channel, expiresIn, resendAfter]
      properties:
        mfaToken:
          $ref: '#/components/schemas/OpaqueToken'
        channel: {type: string, enum: [SMS]}
        expiresIn:
          type: integer
          format: int64
          description: Challenge lifetime in seconds.
        resendAfter:
          type: integer
          format: int64
          description: Wait in seconds before requesting another code.
    ContactOtpChallenge:
      type: object
      additionalProperties: false
      required: [mfaToken, channel, expiresIn, resendAfter]
      properties:
        mfaToken:
          $ref: '#/components/schemas/OpaqueToken'
        channel:
          $ref: '#/components/schemas/ContactOtpChannel'
        expiresIn:
          type: integer
          format: int64
          description: Challenge lifetime in seconds.
        resendAfter:
          type: integer
          format: int64
          description: Wait in seconds before requesting another code.
    RegistrationGrant:
      type: object
      additionalProperties: false
      required: [registrationToken, expiresIn]
      properties:
        registrationToken:
          $ref: '#/components/schemas/OpaqueToken'
        expiresIn:
          type: integer
          format: int64
          description: Grant lifetime in seconds.
    PasswordChangeGrant:
      type: object
      additionalProperties: false
      required: [passwordChangeToken, expiresIn]
      properties:
        passwordChangeToken:
          $ref: '#/components/schemas/OpaqueToken'
        expiresIn:
          type: integer
          format: int64
          description: Grant lifetime in seconds.
    PasswordResetGrant:
      type: object
      additionalProperties: false
      required: [passwordResetToken, expiresIn]
      properties:
        passwordResetToken:
          $ref: '#/components/schemas/OpaqueToken'
        expiresIn:
          type: integer
          format: int64
          description: Grant lifetime in seconds.
    RegisteredAccount:
      type: object
      additionalProperties: false
      required: [userId, status]
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
        status: {type: string, enum: [UNKNOWN, PENDING_VERIFICATION, ACTIVE, SUSPENDED, DEACTIVATED]}
        tokens:
          $ref: '#/components/schemas/TokenPair'
    AuthSettings:
      type: object
      additionalProperties: false
      required: [loginEnabled, registerEnabled, defaultOtpChannel, emailNotificationEnabled, smsNotificationEnabled, inAppNotificationEnabled]
      properties:
        loginEnabled: {type: boolean}
        registerEnabled: {type: boolean}
        defaultOtpChannel:
          $ref: '#/components/schemas/OtpChannel'
        emailNotificationEnabled: {type: boolean}
        smsNotificationEnabled: {type: boolean}
        inAppNotificationEnabled: {type: boolean}
    Jwks:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [kty, kid, n, e]
            properties:
              kty: {type: string, enum: [RSA]}
              kid: {type: string}
              n:
                type: string
                pattern: ^[A-Za-z0-9_-]+$
              e:
                type: string
                pattern: ^[A-Za-z0-9_-]+$
    Authenticated:
      type: object
      additionalProperties: false
      required: [step, tokens]
      properties:
        step: {type: string, enum: [SUCCESS]}
        tokens:
          $ref: '#/components/schemas/TokenPair'
    OtpRequired:
      type: object
      additionalProperties: false
      required: [step, challenge]
      properties:
        step: {type: string, enum: [OTP_REQUIRED]}
        challenge:
          $ref: '#/components/schemas/OtpChallenge'
    EmailOtpRequired:
      type: object
      additionalProperties: false
      required: [step, challenge]
      properties:
        step: {type: string, enum: [OTP_REQUIRED]}
        challenge:
          $ref: '#/components/schemas/EmailOtpChallenge'
    SmsOtpRequired:
      type: object
      additionalProperties: false
      required: [step, challenge]
      properties:
        step: {type: string, enum: [OTP_REQUIRED]}
        challenge:
          $ref: '#/components/schemas/SmsOtpChallenge'
    ContactOtpRequired:
      type: object
      additionalProperties: false
      required: [step, challenge]
      properties:
        step: {type: string, enum: [OTP_REQUIRED]}
        challenge:
          $ref: '#/components/schemas/ContactOtpChallenge'
    PasswordChangeRequired:
      type: object
      additionalProperties: false
      required: [step, passwordChange]
      properties:
        step: {type: string, enum: [PASSWORD_CHANGE_REQUIRED]}
        passwordChange:
          $ref: '#/components/schemas/PasswordChangeGrant'
    PasswordResetRequired:
      type: object
      additionalProperties: false
      required: [step, passwordReset]
      properties:
        step: {type: string, enum: [PASSWORD_RESET_REQUIRED]}
        passwordReset:
          $ref: '#/components/schemas/PasswordResetGrant'
    PasswordUpdated:
      type: object
      additionalProperties: false
      required: [step]
      properties:
        step: {type: string, enum: [PASSWORD_UPDATED_LOGIN_REQUIRED]}
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required: [success, message, messageFa, data, timestamp]
      properties:
        success: {type: boolean, enum: [true]}
        message: {type: string}
        messageFa: {type: string}
        data: {}
        timestamp:
          type: string
          format: date-time
          description: UTC timestamp generated when Auth builds the response.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, code, message, messageFa, data, timestamp]
      properties:
        success: {type: boolean, enum: [false]}
        code: {type: string}
        message: {type: string}
        messageFa: {type: string}
        data: {}
        timestamp:
          type: string
          format: date-time
          description: UTC timestamp generated when Auth builds the response.
    NullData:
      type: object
      nullable: true
      enum:
        - null
    ValidationData:
      oneOf:
        - $ref: '#/components/schemas/NullData'
        - $ref: '#/components/schemas/FieldValidationData'
    FieldValidationData:
      type: object
      additionalProperties: false
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties: {type: string}
          description: Map from Java DTO field names to validation messages.
    RetryData:
      type: object
      additionalProperties: false
      required: [retryAfterSeconds]
      properties:
        retryAfterSeconds:
          type: integer
          format: int64
          minimum: 1
    EmailOtpRequiredResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EmailOtpRequired'
    SmsOtpRequiredResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SmsOtpRequired'
    ContactOtpChallengeResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ContactOtpChallenge'
    RegistrationGrantResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RegistrationGrant'
    RegisteredAccountResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RegisteredAccount'
    TokenPairResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenPair'
    EmptyResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/NullData'
    PasswordChangeRequiredResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PasswordChangeRequired'
    PasswordUpdatedResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PasswordUpdated'
    ContactOtpRequiredResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ContactOtpRequired'
    AuthSettingsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthSettings'
