name: Verify messaging contracts

on:
  pull_request:
    paths:
      - 'messaging/**'
      - 'tests/messaging/**'
      - '.github/workflows/messaging-ci.yml'
  push:
    branches: [main]
    paths:
      - 'messaging/**'
      - 'tests/messaging/**'
      - '.github/workflows/messaging-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/messaging/requirements.txt
      - run: python -m unittest discover -s tests/messaging -v
