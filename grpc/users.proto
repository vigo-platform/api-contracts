syntax = "proto3";

package vigo.user.v1;

option java_multiple_files = true;
option java_package = "ir.vigoapp.contracts.user.v1";
option java_outer_classname = "UserServiceProto";


// =====================================
//              USER SERVICE
// =====================================

// Internal service-to-service API.
//
// Security:
// - All RPCs require encrypted transport and service authentication.
// - Authorization must be enforced separately for each RPC.
// - Credential lookup and mutation RPCs are restricted to Auth.
// - Password hashes must never appear in logs or traces.
//
// Responsibilities:
// - Auth validates password policy, generates hashes and verifies passwords.
// - User stores the complete encoded hash without rehashing it.
// - User never receives the original password.
//
// Idempotency for mutation RPCs:
// - Keys are scoped by authenticated caller and RPC.
// - Same key + same payload returns the original successful result.
// - Same key + different payload returns INVALID_ARGUMENT.
// - Concurrent requests with the same key must not execute twice.
// - The mutation and its idempotency result must be committed atomically.
// - Retention must cover the documented client retry window.
service UserService {

  // Returns credential data exclusively for Auth.
  //
  // Errors:
  // INVALID_ARGUMENT: Invalid email.
  // NOT_FOUND: User does not exist.
  rpc GetUserLoginInfoByEmail (GetUserLoginInfoByEmailRequest)
      returns (UserLoginInfoResponse);

  // Returns credential data exclusively for Auth.
  //
  // Errors:
  // INVALID_ARGUMENT: Invalid phone.
  // NOT_FOUND: User does not exist.
  rpc GetUserLoginInfoByPhone (GetUserLoginInfoByPhoneRequest)
      returns (UserLoginInfoResponse);

  // Returns credential data exclusively for Auth.
  // Useful for password verification during authenticated operations.
  //
  // Errors:
  // INVALID_ARGUMENT: Invalid user ID.
  // NOT_FOUND: User does not exist.
  rpc GetUserLoginInfoById (GetUserLoginInfoByIdRequest)
      returns (UserLoginInfoResponse);

  // Returns account data without exposing the password hash.
  //
  // Errors:
  // INVALID_ARGUMENT: Invalid user ID.
  // NOT_FOUND: User does not exist.
  rpc GetUserById (GetUserByIdRequest)
      returns (UserAuthInfo);

  // Advisory check only.
  // Does not reserve the email or guarantee a later signup will succeed.
  rpc CheckEmailExists (CheckEmailExistsRequest)
      returns (ExistsResponse);

  // Advisory check only.
  // Does not reserve the phone or guarantee a later signup will succeed.
  rpc CheckPhoneExists (CheckPhoneExistsRequest)
      returns (ExistsResponse);

  // Creates the account using a password hash generated by Auth.
  //
  // User must enforce uniqueness at the database level.
  // Roles, status and verification flags are assigned server-side.
  //
  // Errors:
  // INVALID_ARGUMENT: Invalid input or invalid idempotency key usage.
  // ALREADY_EXISTS: Email or phone is already registered.
  rpc CreateUser (CreateUserRequest)
      returns (CreateUserResponse);

  // Shared operation for BOTH password change and password reset.
  //
  // Before calling, Auth must:
  // - Authorize the target user and operation.
  // - For change: validate the session and required reauthentication.
  // - For reset: validate and consume the recovery challenge.
  // - Validate the new password policy.
  // - Generate the new encoded password hash.
  //
  // User authorizes the service caller and updates the stored hash.
  // User does not verify the original password or recovery challenge.
  //
  // Errors:
  // INVALID_ARGUMENT: Invalid input or invalid idempotency key usage.
  // NOT_FOUND: User does not exist.
  // ABORTED: Credential version does not match the expected version.
  // PERMISSION_DENIED: Caller cannot perform this operation.
  rpc ChangeUserPassword (ChangeUserPasswordRequest)
      returns (ChangeUserPasswordResponse);
}


// =====================================
//             SHARED TYPES
// =====================================

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_PENDING_VERIFICATION = 1;
  USER_STATUS_ACTIVE = 2;
  USER_STATUS_SUSPENDED = 3;
  USER_STATUS_DEACTIVATED = 4;
}

message UserAuthInfo {
  // Positive, stable user identifier.
  int64 user_id = 1;

  // Stable role identifiers assigned by the server.
  repeated string roles = 2;

  // Absent when the user has no corresponding identifier.
  optional string email = 3;
  optional string phone = 4;

  // Auth must explicitly handle account status.
  // UNSPECIFIED must never grant access.
  UserStatus status = 5;

  // False when the identifier is absent or not verified.
  bool email_verified = 6;
  bool phone_verified = 7;

  // Starts at 1.
  // Incremented atomically whenever the password hash is replaced.
  int64 credential_version = 8;
}


// =====================================
//          LOGIN / CREDENTIAL DATA
// =====================================

message GetUserLoginInfoByEmailRequest {
  // Required, non-empty, valid email.
  string email = 1;
}

message GetUserLoginInfoByPhoneRequest {
  // Required, international E.164 format.
  string phone = 1;
}

message GetUserLoginInfoByIdRequest {
  // Must be greater than zero.
  int64 user_id = 1;
}

message UserLoginInfoResponse {
  // Populated on every successful response.
  UserAuthInfo user = 1;

  // Complete encoded password hash generated by Auth.
  // Includes the algorithm, parameters and salt required for verification.
  //
  // Sensitive: accessible only to authorized Auth callers.
  // Must never be returned to an end user or logged.
  string password_hash = 2;
}


// =====================================
//          ACCOUNT DATA LOOKUP
// =====================================

message GetUserByIdRequest {
  // Must be greater than zero.
  int64 user_id = 1;
}


// =====================================
//           EXISTENCE CHECKS
// =====================================

message CheckEmailExistsRequest {
  // Required, non-empty, valid email.
  string email = 1;
}

message CheckPhoneExistsRequest {
  // Required, international E.164 format.
  string phone = 1;
}

message ExistsResponse {
  bool exists = 1;
}


// =====================================
//                SIGNUP
// =====================================

message CreateUserRequest {
  // At least one identifier must be present and non-empty.
  // Both may be supplied.
  //
  // User applies the same normalization rules during creation
  // and lookup, and enforces database uniqueness for each identifier.
  optional string email = 1;
  optional string phone = 2;

  string first_name = 3;
  string last_name = 4;

  // Required, complete encoded password hash generated by Auth.
  // User stores it unchanged and must not hash it again.
  string password_hash = 5;

  // Required, unique per logical signup operation.
  //
  // Retries must reuse BOTH the key and the original payload,
  // including the exact same password_hash.
  // Auth must not generate a fresh salted hash for each retry.
  string idempotency_key = 6;
}

message CreateUserResponse {
  // Populated on every successful response.
  // credential_version is 1 for a newly created account.
  UserAuthInfo user = 1;
}


// =====================================
//        PASSWORD CHANGE / RESET
// =====================================

message ChangeUserPasswordRequest {
  // Must be greater than zero.
  // Auth derives this ID from the authorized change/reset flow.
  int64 user_id = 1;

  // Required, complete encoded password hash generated by Auth.
  // User stores it unchanged and must not hash it again.
  string new_password_hash = 2;

  // Required, unique per logical password update.
  //
  // Retries must reuse the original key and exact payload.
  // A successful retry must not increment credential_version again.
  string idempotency_key = 3;

  // Required by API validation; must be greater than zero.
  //
  // Auth obtains this value from the account data.
  // User compares and updates the version atomically with the hash.
  // A mismatch returns ABORTED without changing the password.
  //
  // An already-completed idempotent retry returns its stored result
  // before evaluating this version check again.
  int64 expected_credential_version = 4;
}

message ChangeUserPasswordResponse {
  // Credential version after the successful update.
  int64 credential_version = 1;
}